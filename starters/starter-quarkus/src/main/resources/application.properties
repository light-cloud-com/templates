# Cloud Run hands the port to listen on in $PORT; Quarkus reads
# quarkus.http.port, so without this the container listens on 8080 no matter
# what the platform asked for and the health check never passes.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# An uber-jar puts everything in target/*-runner.jar. The default fast-jar
# layout writes target/quarkus-app/quarkus-run.jar plus loose dependencies,
# which a generic `COPY target/*.jar` cannot pick up in one piece.
quarkus.package.jar.type=uber-jar
