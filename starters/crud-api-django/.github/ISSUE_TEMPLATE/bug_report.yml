name: Bug report
description: Something in this template does not work as the README describes.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Clone the repository
        2. Run ...
        3. Open ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen
      options:
        - Running locally
        - Deployed on Light Cloud
        - Deployed somewhere else
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Operating system and runtime version, for example macOS 15 and Node.js 22.12.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
