<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static HTML App</title>
    <meta name="description" content="A plain HTML, CSS and JavaScript site deployed on Light Cloud." />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <script src="assets/js/main.js" defer></script>
  </head>
  <body>
    <div class="layout">
      <header class="header">
        <a class="brand" href="index.html">Static HTML</a>
        <nav class="nav" aria-label="Main">
          <a href="index.html" aria-current="page">Home</a>
          <a href="about.html">About</a>
        </nav>
      </header>

      <main class="main">
        <h1>Welcome to Static HTML</h1>
        <p>Your site is ready to deploy on Light Cloud.</p>
        <div class="card">
          <button type="button" class="button" id="counter-btn">Count is <span id="count">0</span></button>
          <p>Edit <code>index.html</code> to get started.</p>
        </div>
      </main>

      <footer class="footer">
        <p>Deployed with Light Cloud</p>
      </footer>
    </div>
  </body>
</html>
